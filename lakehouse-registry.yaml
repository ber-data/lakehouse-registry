id: ber_registry:lakehouse-registry
title: BER Lakehouse Registry
description: >-
  The BER lakehouse registry. Schemas, standards, and reporting formats
  relevant to BER lakehouse data, imported from the BER data management
  "schema sources" tracking sheet. Each schema/standard is registered as a
  data source hosted (or planned to be hosted) in the BRIDGE lakehouse.
  This file is the registry itself: edit it to add or update entries, and
  validate with `just test`.
lakehouses:
  - id: ber_registry:lakehouse-bridge-starburst
    title: BRIDGE Lakehouse
    description: >-
      Starburst-based BRIDGE data lakehouse serving as the primary hosting
      platform for data conforming to the registered BER schema sources.
      Platform is Starburst (Trino); recorded as 'other' because the
      PlatformType enum does not yet include starburst.
    operator: Lawrence Berkeley National Laboratory
    platform_type: other
    created_date: "2026-09-21"
    catalog_entries:

      - id: ber_registry:schema-nmdc-schema
        title: nmdc-schema
        description: >-
          National Microbiome Data Collaborative (NMDC) LinkML schema and
          submission schema. Field/element names are intended to be clearly
          defined with metadata, not just data labels.
        created_date: "2026-09-21"
        owner: Montana Smith
        contact_point:
          contact_name: Montana Smith
          contact_email: unknown@lbl.gov
        namespace: nmdc_schema
        status: active
        is_deprecated: false
        update_schedule: unknown
        access_level: public
        documentation_url: https://github.com/microbiomedata/nmdc-schema
        facility: LBNL, PNNL
        project_affiliation:
          - NMDC
        keywords:
          - schema
          - linkml
          - microbiome
        format:
          - LinkML YAML
        data_quality_notes: >-
          Supports embargoed data and pipelines/workflows. See also the
          submission schema at
          https://github.com/microbiomedata/submission-schema. Collaborate
          with user groups/use cases to identify how to condense if need be.

      - id: ber_registry:schema-idea-schema
        title: IDeA-schema
        description: >-
          A schema for AI-driven enzyme discovery and biosynthetic pathway
          optimization. Represents a target reaction, the enzyme families
          ranked against it, candidate enzymes and their catalytic sites,
          predicted and mechanistically explained mutational effects on
          catalysis, and multi-enzyme pathways to a target molecule. Designed
          to run over federated DOE data (KBase, JGI, EMSL) accessed through
          the BER Data Lakehouse.
        created_date: "2026-09-21"
        owner: Arvind Ramanathan
        contact_point:
          contact_name: Arvind Ramanathan
          contact_email: unknown@lbl.gov
        namespace: idea_schema
        status: experimental
        is_deprecated: false
        update_schedule: unknown
        access_level: internal
        facility: ANL, ORNL
        project_affiliation:
          - Genesis Mission
        keywords:
          - schema
          - enzyme discovery
          - AI
        data_quality_notes: >-
          In development under the Genesis Mission / DOE BER IDeA (Intelligent
          Design Assistant) concept. Two-agent design: a discovery agent that
          ranks enzyme families against a plain reaction description, and a
          reasoner agent that predicts and explains mutational effects on
          catalysis. Class list is proposed and pending formal LinkML
          implementation; repo link and 'using LinkML' / 'production' status
          to be updated once the schema is stood up. Supports embargoed data
          and pipelines/workflows.

